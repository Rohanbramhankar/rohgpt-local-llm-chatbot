<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071326">
    <title>Offline · RohGPT</title>
    <style>
        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            background: radial-gradient(ellipse at bottom, #123764, #071326 68%);
            color: #eef5ff;
            font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
            text-align: center;
        }
        main { max-width: 440px; padding: 28px; }
        h1 { margin-bottom: 8px; }
        p { color: #a9bdd7; }
        button {
            margin-top: 12px;
            padding: 10px 16px;
            border: 0;
            border-radius: 999px;
            background: #75b8ff;
            color: #071326;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>You’re offline</h1>
        <p>Reconnect to open your chats. Once RohGPT is open, the local Ollama model can answer without internet.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
